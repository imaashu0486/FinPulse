name: FinPulse AI CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Backend Pytest & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Generate Verification Demo Fixtures
        run: |
          python backend/app/services/market_data/demo_generator.py

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: backend
          DEMO_MODE: "True"
          ENABLE_LIVE_YFINANCE: "False"
        run: |
          pytest backend/tests -v --durations=10

      - name: Run Sentiment Model Benchmark
        env:
          PYTHONPATH: backend
        run: |
          python backend/app/services/sentiment/evaluate_sentiment.py

      - name: Run RAG Pipeline Benchmark
        env:
          PYTHONPATH: backend
        run: |
          python backend/app/services/rag/evaluate_rag.py
